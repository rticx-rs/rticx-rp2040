[package]
name = "rticx-rp2040-macro"
version.workspace = true
edition = "2024"
authors = ["Zakaria Madaoui"]
description = "Proc-macro crate for the RTICX RP2040 distribution"
license = "MIT"
repository = "https://github.com/rticx-rs/rticx-rp2040"
homepage = "https://github.com/rticx-rs/rticx/wiki"
keywords = ["rtic", "rticx", "rp2040", "proc-macro", "embedded"]
categories = ["no-std", "embedded"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.35"
syn = { version = "3.0.3", features = ["extra-traits", "full"] }
rticx-core = { version = "0.2" }
rticx-auto-assign = { version = "0.2" }
rticx-sw-pass = { version = "0.2" }
rticx-async-pass = { version = "0.2" }

[features]
autoassign = []
swtasks = []
async = []

