name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check

  clippy:
    name: Clippy warnings as errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: make clippy

  examples:
    name: Build example apps (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: make -C example-apps all
